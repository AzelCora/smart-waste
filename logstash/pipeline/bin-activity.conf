# =============================================================================
# Smart Waste Bin — Logstash Pipeline
# =============================================================================
#
# Flow:
#   Kafka (bin-activity) → parse → enrich → Elasticsearch (bin-activity-YYYY.MM.dd)
#
# Requirements addressed:
#   - geo_point for 2km radius queries
#   - @timestamp from occurred_at for time-series aggregations
#   - Numeric capacity_percent / battery_level for range queries
#   - Payload fields promoted to top level for direct aggregation
#   - keyword fields for bin_id and message_type (no tokenization)
# =============================================================================

# -----------------------------------------------------------------------------
# INPUT — consume from Kafka
# -----------------------------------------------------------------------------
input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}"
    topics            => ["bin-activity"]
    group_id          => "logstash-bin-consumer"
    codec             => "json"         # messages are already JSON from PHP
    auto_offset_reset => "earliest"     # catch up from the beginning on first run
    consumer_threads  => 2             # one thread per Kafka partition (adjust to match)
    decorate_events   => "extended"    # adds kafka metadata (@metadata.kafka.*)
  }
}

# -----------------------------------------------------------------------------
# FILTER — transform and enrich
# -----------------------------------------------------------------------------
filter {

  # ---------------------------------------------------------------------------
  # 1. Timestamp — use the event's own occurred_at, not Logstash ingestion time
  # ---------------------------------------------------------------------------
  date {
    match    => ["occurred_at", "ISO8601"]
    target   => "@timestamp"
    timezone => "UTC"
  }

  # ---------------------------------------------------------------------------
  # 2. Geo point — merge location.x (lon) + location.y (lat) into a geo_point
  #    Elasticsearch geo_point expects { "lat": ..., "lon": ... }
  #    Your PHP sends { "location": { "x": lon, "y": lat } }
  # ---------------------------------------------------------------------------
  mutate {
    add_field => {
      "[location_geo][lat]" => "%{[location][y]}"
      "[location_geo][lon]" => "%{[location][x]}"
    }
  }

  # Convert to float — mutate add_field always creates strings
  mutate {
    convert => {
      "[location_geo][lat]" => "float"
      "[location_geo][lon]" => "float"
    }
  }

  # ---------------------------------------------------------------------------
  # 3. Promote payload fields to the top level based on message type
  #    This lets Elasticsearch index each field with the right type and
  #    makes aggregations straightforward without nested path gymnastics.
  # ---------------------------------------------------------------------------

  # --- Usage event ---
  if [type] == "usage_event" {
    mutate {
      add_field => {
        "user_id"          => "%{[payload][user_id]}"
        "weight_deposited" => "%{[payload][weight_deposited]}"
        "current_weight"   => "%{[payload][current_weight]}"
        "capacity_percent" => "%{[payload][capacity_percent]}"
      }
    }
    mutate {
      convert => {
        "weight_deposited" => "float"
        "current_weight"   => "float"
        "capacity_percent" => "float"
      }
    }
  }

  # --- Capacity warnings (50 / 75 / 90) ---
  if [type] in ["capacity_warning_50", "capacity_warning_75", "capacity_warning_90"] {
    mutate {
      add_field => {
        "capacity_percent"  => "%{[payload][capacity_percent]}"
        "threshold_percent" => "%{[payload][threshold_percent]}"
        "current_weight"    => "%{[payload][current_weight]}"
        "max_capacity"      => "%{[payload][max_capacity]}"
      }
    }
    mutate {
      convert => {
        "capacity_percent"  => "float"
        "threshold_percent" => "float"
        "current_weight"    => "float"
        "max_capacity"      => "float"
      }
    }
  }

  # --- Lid open alert ---
  if [type] == "lid_open_alert" {
    mutate {
      add_field => { "lid_closed" => "%{[payload][lid_closed]}" }
    }
    mutate {
      convert => { "lid_closed" => "boolean" }
    }
  }

  # --- Battery warnings (50 / 25 / 10) ---
  if [type] in ["battery_warning_50", "battery_warning_25", "battery_warning_10"] {
    mutate {
      add_field => {
        "battery_level"     => "%{[payload][battery_level]}"
        "threshold_percent" => "%{[payload][threshold_percent]}"
      }
    }
    mutate {
      convert => {
        "battery_level"     => "float"
        "threshold_percent" => "float"
      }
    }
  }

  # ---------------------------------------------------------------------------
  # 4. Add a convenience severity tag for Kibana alerting / filtering
  # ---------------------------------------------------------------------------
  if [type] == "capacity_warning_90" or [type] == "battery_warning_10" {
    mutate { add_field => { "severity" => "critical" } }
  } else if [type] == "capacity_warning_75" or [type] == "battery_warning_25" {
    mutate { add_field => { "severity" => "warning" } }
  } else if [type] == "capacity_warning_50" or [type] == "battery_warning_50" {
    mutate { add_field => { "severity" => "info" } }
  } else if [type] == "lid_open_alert" {
    mutate { add_field => { "severity" => "warning" } }
  } else {
    mutate { add_field => { "severity" => "none" } }
  }

  # ---------------------------------------------------------------------------
  # 5. Clean up — remove fields we no longer need at the top level
  #    Keep [payload] and [location] raw for reference, remove Kafka metadata
  # ---------------------------------------------------------------------------
  mutate {
    remove_field => ["@version", "event", "occurred_at"]
  }
}

# -----------------------------------------------------------------------------
# OUTPUT — write to Elasticsearch
# -----------------------------------------------------------------------------
output {
  elasticsearch {
    hosts    => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
    user     => "${ELASTICSEARCH_USER:elastic}"
    password => "${ELASTICSEARCH_PASSWORD:changeme}"

    # Daily index rotation — keeps indices manageable and allows
    # time-based retention policies (ILM) to delete old data automatically
    index => "bin-activity-%{+YYYY.MM.dd}"

    # Use bin_id as the document ID prefix + timestamp to allow
    # idempotent re-ingestion without duplicates
    document_id => "%{bin_id}-%{[@timestamp]}"

    # Apply our index template (created separately) so field types
    # are set correctly before the first document lands
    manage_template  => false   # we manage it ourselves via the template file
  }

  # Uncomment for debugging — prints every event to Logstash stdout
  stdout { codec => rubydebug }
}